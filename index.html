<style>
/* Plano: trilho lateral azul-marinho da marca FTVTEC com acento verde-água; área de trabalho clara, editor à esquerda e folha A4 ao vivo à direita. */
:root{
  --bg:#edf1f7; --surface:#ffffff; --surface2:#f5f7fb; --ink:#0d1b36; --muted:#5a6884; --line:#d6deea;
  --accent:#0a7f6b; --accent-ink:#ffffff; --accent-soft:#dcf5ee; --navy:#0f2a5c; --teal:#1ec8a5;
  --rail:#0c1f47; --rail2:#081531; --rail-ink:#dbe6fa; --rail-muted:#8ea2c8; --rail-line:rgba(255,255,255,.09);
  --warn:#946000; --warn-soft:#fbf0d9; --crit:#b3261e; --crit-soft:#f9e3e0; --ok:#1f7a3a; --ok-soft:#e1f3e6;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Sora','Manrope',system-ui,sans-serif;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(13,27,54,.05),0 6px 20px -8px rgba(13,27,54,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070e1d; --surface:#0f1a30; --surface2:#14223d; --ink:#e6edf8; --muted:#93a2bd; --line:#22324f;
  --accent:#2fd4b2; --accent-ink:#04221c; --accent-soft:#10332f; --navy:#9db8ef; --teal:#2fd4b2;
  --rail:#0a1838; --rail2:#050c1c;
  --warn:#e6ab45; --warn-soft:#2f260f; --crit:#f2827a; --crit-soft:#3a1c1b; --ok:#6fcb86; --ok-soft:#14301d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#070e1d; --surface:#0f1a30; --surface2:#14223d; --ink:#e6edf8; --muted:#93a2bd; --line:#22324f;
  --accent:#2fd4b2; --accent-ink:#04221c; --accent-soft:#10332f; --navy:#9db8ef; --teal:#2fd4b2;
  --rail:#0a1838; --rail2:#050c1c;
  --warn:#e6ab45; --warn-soft:#2f260f; --crit:#f2827a; --crit-soft:#3a1c1b; --ok:#6fcb86; --ok-soft:#14301d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:16px 12px;color:var(--rail-ink);
  background:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px) 0 0/28px 100%,radial-gradient(120% 60% at 0% 0%,rgba(30,200,165,.16),transparent 60%),linear-gradient(180deg,var(--rail),var(--rail2))}
.logo{background:#fff;border-radius:14px;padding:10px 14px;display:grid;place-items:center;box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
.logo img{display:block;width:100%;max-width:190px;height:auto}
.appname{padding:0 6px}
.appname b{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.01em;color:#fff;display:block}
.appname small{color:var(--rail-muted);font-size:11.5px;line-height:1.35;display:block;margin-top:2px}
nav.side{display:flex;flex-direction:column;gap:2px}
nav.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--rail-muted);padding:12px 10px 5px}
nav.side a{display:grid;grid-template-columns:26px 1fr;gap:5px 10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--rail-ink);font-weight:500;font-size:13.5px;transition:background .15s}
nav.side a:hover{background:rgba(255,255,255,.07)}
nav.side a.on{background:linear-gradient(90deg,rgba(30,200,165,.24),rgba(30,200,165,.08));color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
nav.side a .n{font-family:var(--mono);font-size:11px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--rail-ink)}
nav.side a.on .n{background:var(--teal);color:#04221c;font-weight:500}
nav.side a.done .n{background:rgba(30,200,165,.2);color:#7ff0d6}
nav.side a .bar{grid-column:2;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
nav.side a .bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.railfoot{margin-top:auto;border-top:1px solid var(--rail-line);padding:12px 6px 2px;font-size:11.5px;color:var(--rail-muted)}
.railfoot .pg{display:flex;justify-content:space-between;color:var(--rail-ink);font-weight:600;margin-bottom:6px}
.railfoot .pg span:last-child{font-family:var(--mono);color:#7ff0d6}
.railfoot .track{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:10px}
.railfoot .track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#1ec8a5,#6fe9cf)}
.col{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 22px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.procsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.procsel .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.procsel select{flex:1;min-width:180px;max-width:460px;font-weight:600}
.procsel .gap{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px;transition:border-color .15s,transform .05s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--crit)}
main{padding:22px 22px 70px;min-width:0}
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px;margin-bottom:12px}
.mhead h1{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.mhead .ref{font-family:var(--mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:999px}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;font-size:13px;color:var(--muted);margin-bottom:14px}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.viewtoggle{display:none;gap:6px;margin-bottom:10px}
@media (max-width:1240px){.work{grid-template-columns:1fr}.viewtoggle{display:flex}.work[data-view="edit"] .pane-doc{display:none}.work[data-view="doc"] .pane-edit{display:none}}
@media (max-width:900px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;padding:12px}.logo{max-width:170px;padding:6px 12px}.rail .appname{display:none}nav.side{flex-direction:row;flex-wrap:wrap;gap:4px}nav.side .grp{display:none}nav.side a{grid-template-columns:24px auto;padding:6px 10px 6px 6px}nav.side a .bar{display:none}.railfoot{display:none}.top{padding:10px 16px}main{padding:16px 16px 60px}.pane-doc{position:static}.paper{padding:26px 22px}}
fieldset{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px 16px;margin:0 0 16px;box-shadow:var(--shadow);min-width:0}
legend{font-family:var(--display);font-weight:600;padding:0 8px;font-size:14px;letter-spacing:-.01em}
legend .lr{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-weight:500;font-size:13px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.f label .req{color:var(--crit);font-size:11px}
.f label .lr{color:var(--muted);font-weight:400;font-size:11.5px}
.f .help{color:var(--muted);font-size:12px}
.f input,.f select,.f textarea,.cell{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:7px 9px;width:100%}
.f textarea{resize:vertical;min-height:70px;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus,.cell:focus{border-color:var(--accent);outline:none;background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.f .tools{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.chk input{margin-top:3px;width:auto}
.pane-doc{position:sticky;top:68px}
.doctabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.doctabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.doctabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.docbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.docbar .sp{margin-left:auto;color:var(--muted);font-size:12px}
.paperwrap{background:color-mix(in srgb,var(--navy) 16%,var(--bg));border:1px solid var(--line);border-radius:14px;padding:14px;max-height:calc(100vh - 170px);overflow:auto}
.paper{background:#fff;color:#1b1b1b;font-family:var(--serif);font-size:13.5px;line-height:1.6;padding:44px 50px;max-width:794px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.paper h1{font-size:15.5px;text-align:center;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 6px;font-family:var(--serif)}
.paper h2{font-size:13.5px;text-transform:uppercase;margin:18px 0 6px;font-family:var(--serif)}
.paper h3{font-size:13.5px;margin:12px 0 4px;font-family:var(--serif)}
.paper p{margin:0 0 9px;text-align:justify}
.paper .sub{text-align:center;font-style:italic;margin:0 0 12px}
.paper .dh{text-align:center;border-bottom:1.5px solid #1b1b1b;padding-bottom:8px;margin-bottom:12px;font-size:12px;line-height:1.35}
.paper .dh b{font-size:13px;letter-spacing:.04em}
.paper table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:12.5px}
.paper td,.paper th{border:1px solid #777;padding:4px 6px;vertical-align:top;text-align:left}
.paper th{background:#e9edf3}
.paper td.num,.paper th.num{text-align:right;font-variant-numeric:tabular-nums}
.paper .meta td{border:none;padding:1px 0}
.paper .meta td:first-child{font-weight:600;width:150px}
.paper .vazio{color:#a33;font-style:italic}
.paper .sig{margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px;text-align:center;font-size:12.5px;line-height:1.35}
.paper .sig div{border-top:1px solid #1b1b1b;padding-top:5px}
.paper .right{text-align:right}
.paper .email{font-family:var(--font);font-size:13px}
.paper .email .hdr{border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:12px}
.paper ul,.paper ol{margin:0 0 10px;padding-left:22px}
.paper .box{border:1px solid #999;padding:8px 10px;margin:6px 0 12px}
.paper .tip{font-family:var(--font);font-size:11.5px;color:#7a5a00;background:#fff6db;border:1px dashed #d9b34a;padding:6px 8px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.card .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card .v{font-family:var(--display);font-weight:600;font-size:15px;margin:3px 0;letter-spacing:-.01em}
.card .d{font-size:12.5px;color:var(--muted)}
.card.hl{border-color:var(--accent);background:var(--accent-soft)}
.alert{border-radius:8px;padding:8px 11px;margin:0 0 8px;font-size:13px;border:1px solid}
.alert.w{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink)}
.alert.c{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.alert.o{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.alert b{margin-right:4px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.o{background:var(--ok-soft);color:var(--ok)} .pill.w{background:var(--warn-soft);color:var(--warn)} .pill.c{background:var(--crit-soft);color:var(--crit)} .pill.n{background:var(--accent-soft);color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tblwrap{overflow-x:auto}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .cell{padding:4px 6px;font-size:12.5px;min-width:70px}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.itemcard{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;background:var(--surface2)}
.itemhead{display:grid;grid-template-columns:1fr 90px 90px auto;gap:8px;align-items:end;margin-bottom:8px}
@media (max-width:560px){.itemhead{grid-template-columns:1fr 1fr}}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats b{font-family:var(--mono);font-weight:500}
.stats .est{background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:6px;font-weight:600}
.heat{display:grid;grid-template-columns:24px repeat(5,1fr);gap:3px;max-width:360px;font-size:11px}
.heat div{aspect-ratio:1.6;display:grid;place-items:center;border-radius:4px;font-weight:700;font-family:var(--mono)}
.heat .ax{background:none;color:var(--muted);font-weight:400}
.lv1{background:#cfe8cf;color:#1f4d22}.lv2{background:#f7e3a6;color:#5c4300}.lv3{background:#f4b98a;color:#5e2a00}.lv4{background:#e88a84;color:#4d0d08}
.risk{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--surface2)}
.risk .rh{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.risk .rh .cell{flex:1;min-width:200px;font-weight:600}
.lib{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.lib button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:var(--surface);padding:7px 10px;cursor:pointer;font-size:13px}
.lib button:hover{background:var(--accent-soft)}
.lib button small{color:var(--muted);white-space:nowrap}
.cl{list-style:none;padding:0;margin:0}
.cl li{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--line)}
.cl li input{margin-top:3px}
.cl li .lr{color:var(--muted);font-size:12px;display:block}
.cl li.done span:first-child{text-decoration:line-through;color:var(--muted)}
.flow{display:grid;gap:6px;counter-reset:fl;margin-bottom:14px}
.flow button{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 10px;cursor:pointer}
.flow button:hover{border-color:var(--accent)}
.flow button.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.flow .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.flow .who{font-size:11.5px;color:var(--muted)}
.leis table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13px;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.leis{overflow-x:auto}
.leis td,.leis th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.leis th{color:var(--muted);font-weight:600;font-size:12px}
.leis td.num{font-family:var(--mono);white-space:nowrap}
.leis h2{font-family:var(--display);font-weight:600;font-size:16px;margin:24px 0 10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:40;padding:16px}
.modal.on{display:grid}
.modal .box{background:var(--surface);border-radius:12px;padding:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.modal textarea{width:100%;min-height:220px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface2)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 70% at 50% 0%,rgba(30,200,165,.18),transparent 60%),linear-gradient(180deg,var(--rail),var(--rail2))}
.gatecard{width:100%;max-width:404px;background:var(--surface);border-radius:18px;padding:26px 26px 22px;box-shadow:0 30px 60px -22px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:11px}
.gatecard .logo{background:#fff;border-radius:12px;padding:8px 14px;max-width:172px;margin:0 auto 2px;box-shadow:none}
.gatecard h1{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0;text-align:center}
.gatemsg{color:var(--muted);font-size:13.5px;line-height:1.55;text-align:center;margin:0}
.gatetabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.gatetabs button{border:none;background:transparent;border-radius:8px;padding:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.gatetabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.gatecard form{display:flex;flex-direction:column;gap:10px}
.btn.wide{width:100%;justify-content:center;text-align:center;padding:10px}
.gatesep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.gatesep::before,.gatesep::after{content:"";height:1px;background:var(--line);flex:1}
.gatenota{color:var(--muted);font-size:12px;text-align:center;margin:0}
.gatefoot{color:var(--rail-muted);font-size:12px;text-align:center;margin:16px 0 0}
.gateuser{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:center;font-size:13px}
.gateuser span{display:block;color:var(--muted);font-size:12px}
.gaterow{display:grid;grid-template-columns:1fr auto;gap:8px}
.userchip{display:flex;flex-direction:column;line-height:1.2;padding-left:4px;border-left:1px solid var(--line);margin-left:2px}
.userchip b{font-size:12.5px}
.userchip span{font-size:11px;color:var(--muted)}
#estado{align-self:center}
#estado:empty{display:none}
.empty{display:grid;place-items:center;gap:14px;text-align:center;padding:56px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.empty p{color:var(--muted);max-width:430px;margin:0}
.empty .row{justify-content:center}
code{font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .top,.rail,.mhead,.note,.pane-edit,.doctabs,.docbar,.viewtoggle{display:none!important}
  .app,.work{display:block}
  main{padding:0}
  .paperwrap{background:none;padding:0;max-height:none;overflow:visible}
  .paper{box-shadow:none;padding:0;max-width:none}
  .pane-doc{position:static;display:block!important}
}
</style>

function ext3(n){const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];if(n===100)return 'cem';const p=[];const h=Math.floor(n/100),r=n%100;if(h)p.push(c[h]);if(r<20){if(r)p.push(u[r])}else{p.push(d[Math.floor(r/10)]+(r%10?' e '+u[r%10]:''))}return p.join(' e ')}
function extInt(n){if(n===0)return 'zero';const sc=[[1e9,'bilhão','bilhões'],[1e6,'milhão','milhões'],[1e3,'mil','mil'],[1,'','']];let rest=n;const parts=[];for(const [v,s1,pl] of sc){const q=Math.floor(rest/v);rest%=v;if(!q)continue;parts.push({t:v===1e3&&q===1?'mil':ext3(q)+(v>1?' '+(q===1?s1:pl):''),q})}let out=parts[0].t;for(let i=1;i<parts.length;i++){const q=parts[i].q;out+=(q<100||q%100===0)?' e ':' ';out+=parts[i].t}return out}
function extenso(v){v=Math.round(num(v)*100)/100;const r=Math.floor(v),c=Math.round((v-r)*100);let s='';if(r){s=extInt(r)+(r===1?' real':((r%1e6===0)?' de reais':' reais'))}if(c){s+=(s?' e ':'')+extInt(c)+(c===1?' centavo':' centavos')}return s||'zero real'}

const INCISOS={I:'I · Painel de preços / PNCP',II:'II · Contratações similares (Adm. Pública / SIIM)',III:'III · Mídia, tabelas ou sites especializados',IV:'IV · Pesquisa direta com fornecedores',V:'V · Base nacional de notas fiscais'};
const VALIDADE={I:365,II:365,III:180,IV:180,V:365};
function calcItem(it,dataRef,metodo){
  const cots=(it.cot||[]).map(c=>{const d=dias(c.data,dataRef);const venc=c.data?(d>VALIDADE[c.inciso||'IV']||d<0):false;return{...c,v:num(c.valor),venc,dd:d}});
  const base=cots.filter(c=>!c.excl&&!c.venc&&c.v>0);
  const med=median(base.map(c=>c.v));
  cots.forEach(c=>{c.desvio=med&&c.v?(c.v-med)/med*100:0;c.flag=Math.abs(c.desvio)>=25?(c.desvio>0?'acima':'abaixo'):''});
  const val=base.map(c=>c.v);
  const r={cots,n:val.length,media:mean(val),mediana:median(val),menor:val.length?Math.min(...val):0};
  r.est=metodo==='media'?r.media:metodo==='menor'?r.menor:r.mediana;
  r.total=r.est*num(it.qtd);
  r.menorCot=base.slice().sort((a,b)=>a.v-b.v)[0];
  return r}

      else{Object.assign(r,{modalidade:'Pregão eletrônico',fund:'Arts. 6º, XLI, 28, I, e 29 da Lei 14.133/2021',decreto:'Decreto Municipal nº 32.576/2023',prazo:g.tipo==='bem'?'8 dias úteis (art. 55, I, a)':'10 dias úteis (art. 55, II, a)'})}
      if(h==='srp'){r.modalidade+=' com Sistema de Registro de Preços';r.decreto+='; Dec. 32.570/2023 (alterado pelo 33.902/2024) e 34.687/2024';}
      if(g.tipo==='servico_mo')r.alertas.push(['w','Dedicação exclusiva de mão de obra: exija planilha de custos, preveja repactuação (art. 135) e garanta o cumprimento das obrigações trabalhistas (art. 121, §3º).']);
    }
  }
  if(r.tipoProc==='inexig'){r.metodo=r.metodo||'Notas fiscais do contratado';}
  // ETP (Dec. 32.577/2023, art. 13)
  if(r.tipoProc==='inexig')r.etp='Obrigatório';
  // ME/EPP (Dec. 32.569/2023)
  if(r.tipoProc==='licitacao'){
    if(v>0&&v<=LIM.meepp)r.meepp.push('Licitação exclusiva para ME, EPP e demais beneficiários: valor estimado até R$ 80.000,00 (Dec. 32.569, art. 7º; LC 123, art. 48, I).');
    else if(g.tipo==='bem'&&g.divisivel==='sim')r.meepp.push('Cota reservada de até 25% do objeto para beneficiários (Dec. 32.569, art. 9º).');
    if(['obra','servico_eng','servico','servico_continuo','servico_mo'].includes(g.tipo))r.meepp.push('Pode prever subcontratação de beneficiários com percentuais mínimo e máximo (Dec. 32.569, art. 8º).');
    r.meepp.push('Empate ficto: até 5% no pregão e 10% nas demais modalidades (Dec. 32.569, art. 6º).');
    r.meepp.push('Prioridade para beneficiários sediados na Região Metropolitana de Jundiaí até 5% no pregão (10% nas demais), se justificada e prevista no edital (Dec. 32.569, art. 10).');
  }else if(r.tipoProc==='dispensa'){r.meepp.push('Benefícios dos arts. 7º a 10 do Dec. 32.569 não se aplicam à dispensa (art. 11); o empate ficto de 5% vale na dispensa eletrônica (art. 6º).')}
  else r.meepp.push('Benefícios a ME/EPP não se aplicam à inexigibilidade (Dec. 32.569, art. 11).');
  if(g.tipo==='obra'&&v>=LIM.grandeVulto)r.alertas.push(['w','Grande vulto: matriz de alocação de riscos obrigatória (art. 22, §3º) e programa de integridade do vencedor (art. 25, §4º).']);
  if(g.pca==='nao')r.alertas.push(['w','Demanda fora do PCA: justifique nos autos e peça a revisão do plano (Dec. 33.221/2023, arts. 13 e 14).']);
  if(!est&&!tp)r.alertas.push(['w','Informe a estimativa preliminar de valor para concluir o enquadramento.']);
  if(p.org.preset&&p.org.preset!=='pmj')r.alertas.push(['o',`Entidade da Administração Indireta: os decretos municipais se aplicam no que couber ou conforme regulamento interno próprio (Dec. 32.572/2023, art. 2º; Dec. 32.577/2023, art. 1º). Confirme o normativo da ${p.org.sigla||'entidade'}.`]);
  if(r.tipoProc==='licitacao')r.alertas.push(['o','Controle prévio de legalidade pelo órgão jurídico (art. 53). Para pregão, verifique a aplicação do Parecer Referencial UGNJC nº 01/24.']);
  return r}

/* ================= Renderização de campos ================= */
function fieldHTML(f,p){
  const val=get(p,f.k)??'';const id='f_'+f.k.replace(/\./g,'_');
  const lab=`<label for="${id}">${esc(f.l)}${f.req?'<span class="req">obrigatório</span>':''}${f.ref?`<span class="lr">${esc(f.ref)}</span>`:''}</label>`;
  const da=`id="${id}" data-k="${f.k}"${f.rr?' data-rr="1"':''}`;
  let c;
  if(f.t==='textarea')c=`<textarea ${da} rows="${f.rows||3}">${esc(val)}</textarea>`;
  else if(f.t==='select')c=`<select ${da}>${f.o.map(([v,l])=>`<option value="${esc(v)}"${String(val)===v?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(f.t==='date')c=`<input type="date" ${da} value="${esc(val)}">`;
  else if(f.t==='number')c=`<input type="number" step="any" ${da} value="${esc(val)}">`;
  else if(f.t==='money')c=`<input type="text" inputmode="decimal" placeholder="0,00" ${da} value="${esc(val)}">`;
  else c=`<input type="text" ${da} value="${esc(val)}">`;
  const tools=f.tpl?`<div class="tools"><button type="button" class="btn sm" data-act="tpl" data-k="${f.k}">Inserir texto modelo</button></div>`:'';
  const extra=f.t==='money'&&num(val)?`<span class="help">${brl(val)}</span>`:'';
  return `<div class="f${f.full?' full':''}">${lab}${c}${extra}${f.h?`<span class="help">${esc(f.h)}</span>`:''}${tools}</div>`}
const fs=(title,fields,p,ref)=>`<fieldset><legend>${esc(title)}${ref?`<span class="lr">${esc(ref)}</span>`:''}</legend><div class="grid">${fields.map(f=>fieldHTML(f,p)).join('')}</div></fieldset>`;
const allFields=()=>[...F.org,...F.geral,...F.dfd,...F.tr,...F.contrato,...F.autoriz,...F.pro1,...F.pro2,...F.pro3,...F.pro4,...F.pro5];
function findField(k){return allFields().find(f=>f.k===k)}

function cab(p,titulo,sub){const o=p.org;return `<div class="dh"><b>${esc((o.nome||'[ENTIDADE]').toUpperCase())}${o.sigla?' – '+esc(o.sigla):''}</b>${p.geral.unidade?'<br>'+esc(p.geral.unidade):''}${o.endereco?'<br>'+esc(o.endereco):''}</div><h1>${titulo}</h1>${sub?`<p class="sub">${sub}</p>`:''}`}
const meta=rows=>`<table class="meta">${rows.filter(r=>r).map(([a,b])=>`<tr><td>${esc(a)}</td><td>${b}</td></tr>`).join('')}</table>`;
const sigs=list=>`<div class="sig">${list.map(s=>`<div>${s.map((x,i)=>i?esc(x):'<b>'+fill(x,'[nome]')+'</b>').join('<br>')}</div>`).join('')}</div>`;
const local=(iso)=>`<p class="right">Jundiaí, ${iso?dtExt(iso):'___ de __________ de '+new Date().getFullYear()}.</p>`;
function precoTabela(p){const m=metodoEf(p),ref=p.precos.dataPesquisa||hoje();let tot=0;const rows=(p.precos.itens||[]).map((it,i)=>{const c=calcItem(it,ref,m);tot+=c.total;return `<tr><td>${i+1}</td><td>${fill(it.desc)}</td><td>${esc(it.unid)}</td><td class="num">${nf(it.qtd,0)}</td><td class="num">${brl(c.est)}</td><td class="num">${brl(c.total)}</td></tr>`}).join('');return `<table><tr><th>Item</th><th>Descrição</th><th>Unid.</th><th class="num">Qtd.</th><th class="num">Valor unit.</th><th class="num">Valor total</th></tr>${rows}<tr><th colspan="5" class="num">TOTAL ESTIMADO</th><th class="num">${brl(tot)}</th></tr></table>`}
function itensTabela(p){return `<table><tr><th>Item</th><th>Descrição</th><th>Unid.</th><th class="num">Qtd.</th></tr>${(p.precos.itens||[]).map((it,i)=>`<tr><td>${i+1}</td><td>${fill(it.desc)}</td><td>${esc(it.unid)}</td><td class="num">${nf(it.qtd,0)}</td></tr>`).join('')}</table>`}
function componentes(s){return String(s||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [a,b]=l.split(';');return [a.trim(),(b||'').trim()]})}

function docETP(p){const g=p.geral,e=p.etp,a=analise(p);let h=cab(p,'Estudo Técnico Preliminar (ETP)','Lei 14.133/2021, art. 18, §1º · Decreto Municipal nº 32.577/2023')+meta([['Processo SEI',fill(g.sei)],['Objeto',fill(g.objeto)],['Equipe de planejamento',fill(e.equipe)],['Exigência do ETP',`${esc(a.etp)} (${esc(a.etpRef)})`]]);
 if(a.etp!=='Obrigatório')h+=`<div class="tip">Nesta hipótese o ETP é ${a.etp.toLowerCase()}. Se elaborado, pode ser simplificado (Dec. 32.568/2023, art. 5º, §4º).</div>`;
 ETP_ITENS.forEach(([k,n,t,req])=>{const dis=e.dispensa&&e.dispensa[k];h+=`<h2>${n}. ${t}</h2>`;if(dis&&!req)h+=`<p><i>Item não aplicável:</i> ${fill(e['j'+k],'[justificar a não aplicação]')}</p>`;else h+=paras(e[k])});
 return h+`<p class="tip">Registre o ETP no sistema ETP Digital (SIIM) com aprovação do Diretor e/ou Gestor da área (Dec. 32.577/2023, arts. 3º a 5º).</p>`+local()+sigs([[g.responsavel,'Área requisitante'],['','Área técnica'],[g.autoridade,'Aprovação']])}
function docRiscos(p){const g=p.geral;const rs=p.riscos||[];

 h+=`<p>Escala: probabilidade e impacto de 1 (muito baixo) a 5 (muito alto). Nível = P × I: Baixo (1 a 4), Médio (5 a 9), Alto (10 a 14), Extremo (15 a 25).</p>`;

 if(!usados.includes('I')&&!usados.includes('II'))h+=`<p><b>Justificativa da não utilização prioritária dos incisos I e II:</b> ${fill(pc.justPrioritarios,'[justificar por que não foi possível usar o painel de preços/PNCP ou contratações similares]')}</p>`;
 if(usados.includes('IV'))h+=`<p><b>Escolha dos fornecedores consultados (pesquisa direta):</b> ${fill(pc.justFornecedores)}</p>`;

 const excl=[];
 (pc.itens||[]).forEach((it,i)=>{const c=calcItem(it,ref,m);h+=`<h3>Item ${i+1}: ${fill(it.desc)} (${nf(it.qtd,0)} ${esc(it.unid)})</h3><table><tr><th>Fonte (inciso)</th><th>Fornecedor / órgão</th><th>CNPJ</th><th>Data</th><th class="num">Valor unit.</th><th>Situação</th></tr>${c.cots.map(x=>{const st=x.excl?'Desconsiderado':x.venc?'Fora da validade':'Válido';if(x.excl||x.venc)excl.push([i+1,x]);return `<tr><td>${esc(x.inciso)} · ${esc(x.fonte)}</td><td>${fill(x.fornecedor)}</td><td>${esc(x.cnpj)}</td><td>${dt(x.data)}</td><td class="num">${brl(x.v)}</td><td>${st}</td></tr>`}).join('')}</table><p>Preços válidos: ${c.n}. Média ${brl(c.media)} · Mediana ${brl(c.mediana)} · Menor ${brl(c.menor)}. <b>Valor unitário estimado: ${brl(c.est)}</b>; total do item ${brl(c.total)}.</p>`;if(c.n<3)h+=`<p><b>Justificativa para menos de três preços:</b> ${fill(it.just3||pc.justMenos3,'[justificativa da autoridade competente com registro das tentativas, IN 05/2023, art. 6º]')}</p>`});

 if(a.tipoProc==='inexig'){add('inv','Comprovação da inviabilidade de competição',a.fund);a.docs.forEach((d,i)=>add('dx'+i,d,a.fund));add('jp','Justificativa de preço (notas fiscais do contratado com outros órgãos)','Lei 14.133, art. 72, VII · IN 05/2023');add('esc','Razão da escolha do contratado','Lei 14.133, art. 72, VI');add('hab2','Habilitação do contratado','Lei 14.133, art. 72, V');add('jur2','Parecer jurídico','Lei 14.133, art. 72, III');add('pncp2','Divulgação do ato autorizador no PNCP','Lei 14.133, art. 72, parágrafo único');}
 add('ceis','Consulta ao CEIS, CNEP e certidões de inidoneidade antes de contratar','Lei 14.133, art. 91, §4º');

function proCalc(p){const r=p.prorrog;const novoIni=r.fimAtual?addDias(r.fimAtual,1):'';const novoFim=novoIni?addDias(addMeses(novoIni,num(r.meses)||12),-1):'';
 const anos=r.fundamento==='114'?15:10;const limite=r.inicioOriginal?addDias(addMeses(r.inicioOriginal,anos*12),-1):'';
 const mesesTot=r.inicioOriginal&&novoFim?Math.round(dias(r.inicioOriginal,novoFim)/30.44):0;
 const faltam=r.fimAtual?dias(hoje(),r.fimAtual):null;
 const recebidas=(r.fornecedores||[]).filter(f=>f.resposta==='Recebida'&&num(f.mensal)>0);const vals=recebidas.map(f=>num(f.mensal));
 const med=median(vals),men=vals.length?Math.min(...vals):0,mea=mean(vals);const vm=num(r.valorMensal);
 const sug=vals.length<3?'D':(vm<men?'B':vm<=med*1.10?'A':'C');
 const opcao=r.opcao||sug;const vmNovo=r.aceiteMantem==='nao'&&num(r.aceiteReajuste)?vm*(1+num(r.aceiteReajuste)/100):vm;
 return{novoIni,novoFim,limite,mesesTot,faltam,dentro:!limite||!novoFim||novoFim<=limite,recebidas,vals,med,men,mea,vm,sug,opcao,vmNovo,anual:vmNovo*(num(r.meses)||12),anos}}
function proAlerts(p){const r=p.prorrog,c=proCalc(p),A=[];
 if(c.faltam!==null){if(c.faltam<0)A.push(['c',`A vigência terminou em ${dt(r.fimAtual)}. Contrato extinto não pode ser prorrogado: se o aditivo não foi assinado até essa data, será necessária nova contratação.`]);else if(c.faltam<=60)A.push(['c',`Faltam ${c.faltam} dias para o fim da vigência. O termo aditivo precisa ser assinado antes de ${dt(r.fimAtual)}.`]);else if(c.faltam<=120)A.push(['w',`Faltam ${c.faltam} dias para o fim da vigência. Inicie a instrução agora (recomendado: 120 dias de antecedência).`]);else A.push(['o',`Faltam ${c.faltam} dias para o fim da vigência.`])}
 if(r.fundamento==='111')A.push(['w','Contrato por escopo: o prazo é prorrogado automaticamente se o objeto não foi concluído no período (art. 111). Se houve culpa da contratada, ela será constituída em mora.']);
 else if(!c.dentro)A.push(['c',`A nova vigência (${dt(c.novoFim)}) ultrapassa o limite de ${c.anos} anos contado do início (${dt(c.limite)}). Reduza o período (arts. 107 e 114).`]);
 else if(c.limite)A.push(['o',`Nova vigência: ${dt(c.novoIni)} a ${dt(c.novoFim)}. Duração total após a prorrogação: cerca de ${c.mesesTot} meses, de um limite de ${c.anos*12}.`]);
 if(r.aceiteInteresse==='nao')A.push(['c','A contratada não manifestou interesse. Inicie nova contratação.']);

function docProEmail(p){const r=p.prorrog,o=p.org;return `<div class="email"><div class="hdr"><b>Para:</b> ${fill(r.emailContratada,'[e-mail da contratada]')}<br><b>Assunto:</b> Consulta de interesse na prorrogação · Contrato ${esc(r.contratoNum?'SEI '+r.contratoNum:'')}</div>
 <p>Prezados,</p><p>Considerando a proximidade do término da vigência do Contrato ${fill(r.contratoNum)}, celebrado entre a ${esc(o.nome)}${o.sigla?' – '+esc(o.sigla):''} e a empresa ${fill(r.contratada)}, cujo objeto compreende ${esc(lc(r.objeto))}, solicitamos manifestação formal dessa empresa quanto ao interesse na prorrogação da vigência contratual.</p>

 <p>Diante disso, para fins de instrução do processo administrativo, solicitamos que essa empresa se manifeste expressamente quanto:</p><p>I · ao interesse na prorrogação do Contrato ${esc(r.contratoNum)}, por período de ${nf(r.meses||12,0)} (${extInt(num(r.meses)||12)}) meses, nas condições estabelecidas no instrumento contratual;<br>II · à manutenção dos valores atualmente contratados, especialmente do valor mensal de ${vext(r.valorMensal)};<br>III · à manutenção das demais condições, obrigações, especificações técnicas e níveis de qualidade estabelecidos no contrato e no respectivo Termo de Referência;<br>IV · caso a empresa não concorde com a manutenção dos valores, que informe expressamente sua pretensão de reajuste, indicando o percentual pretendido e a respectiva fundamentação contratual.</p>
 ${r.regraReajuste?`<p>Ressaltamos que ${esc(r.regraReajuste)}.</p>`:''}<p>Solicitamos que a manifestação seja encaminhada por escrito, assinada pelo representante legal da empresa, no prazo de ${nf(r.prazoResposta||5,0)} dias úteis, contados do recebimento desta comunicação, para juntada aos autos.</p>
 <p>Esclarecemos que a presente solicitação tem por finalidade instruir o processo de prorrogação contratual, ficando sua efetivação condicionada à análise da vantajosidade para a Administração, à manutenção da qualidade da execução, à disponibilidade orçamentária, à regularidade da contratada e às demais providências legais e administrativas pertinentes.</p>
 <p>Atenciosamente,<br><br><b>${fill(r.gestor)}</b><br>Gestor do Contrato ${esc(r.contratoNum)}<br>${esc(o.nome)}${o.sigla?' – '+esc(o.sigla):''}</p>
 <div class="tip">Resposta esperada da empresa (para conferência): interesse na prorrogação por ${r.meses||12} meses; concordância com a manutenção do valor mensal; manutenção das demais condições; e informação sobre eventual pretensão de reajuste. Junte a resposta ao SEI e registre o nº do documento na etapa 3.</div></div>`}
function docProDesp1(p){const r=p.prorrog,o=p.org,c=proCalc(p);let h=`<div class="dh"><b>${esc((o.nome||'').toUpperCase())}${o.sigla?' – '+esc(o.sigla):''}</b></div>`+despachoHead(p,proX(p));
 if(r.trocaFiscal==='sim')h+=`<p>Considerando que ${r.fiscalAnterior?'o(a) servidor(a) '+esc(r.fiscalAnterior)+', anteriormente responsável pela fiscalização do Contrato nº '+esc(r.contratoNum)+',':'o servidor anteriormente responsável pela fiscalização do contrato'} não mais exerce essa função na ${esc(o.nome)};</p><p>Considerando a ${fill(r.portaria,'[portaria de designação]')}, que designou como responsáveis pela fiscalização dos contratos os servidores nela relacionados, dentre eles o(a) servidor(a) ${fill(r.fiscal)}, ${esc(r.fiscalCargo||'')}${r.fiscalMatricula?', matrícula nº '+esc(r.fiscalMatricula):''};</p>${r.portariaEfeitos?`<p>Considerando, ainda, que a referida Portaria produz efeitos a partir de ${dtExt(r.portariaEfeitos)};</p>`:''}<p>REGISTRA-SE, para fins de atualização e regularização dos autos, que o(a) servidor(a) ${fill(r.fiscal)}${r.fiscalMatricula?', matrícula nº '+esc(r.fiscalMatricula):''}, passa a responder pela fiscalização do Contrato nº ${esc(r.contratoNum)}, em substituição ao servidor anteriormente designado${r.portariaEfeitos?', com efeitos a partir de '+dtExt(r.portariaEfeitos):''}.</p><p>Ao Fiscal do Contrato caberá o acompanhamento da execução contratual, verificando o cumprimento das obrigações assumidas pela contratada, a conformidade dos serviços prestados com o contrato e o Termo de Referência, bem como o registro de eventuais ocorrências e demais providências inerentes à fiscalização (art. 117 da Lei 14.133/2021).</p>`;
 h+=r.aceiteInteresse==='sim'?`<p>Registra-se, ainda, que a contratada, ${esc(r.contratada)}, manifestou formalmente${r.aceiteDoc?' (documento SEI '+esc(r.aceiteDoc)+')':''} seu interesse na prorrogação do Contrato ${esc(r.contratoNum)} pelo período de ${nf(r.meses||12,0)} (${extInt(num(r.meses)||12)}) meses, ${r.aceiteMantem==='sim'?'declarando concordância com a manutenção do valor mensal de '+brl(r.valorMensal)+' e das demais condições contratuais, não apresentando, neste momento, pretensão de reajuste':'solicitando reajuste de '+nf(r.aceiteReajuste||0)+'%, que será objeto de análise específica'}.</p>`:'<p class="vazio">[registrar a manifestação da contratada]</p>';
 h+=`<p>Diante do exposto, encaminhem-se os autos ao Fiscal do Contrato, ${fill(r.fiscal)}, para ciência e manifestação quanto à execução contratual, especialmente quanto ao cumprimento das obrigações pela contratada, à qualidade dos serviços prestados e à existência de eventuais ocorrências, pendências ou fatos que devam ser considerados na análise da prorrogação contratual.</p><p>Após, retornem os autos para prosseguimento da instrução quanto à prorrogação contratual.</p>`;
 return h+local()+sigs([[r.gestor,'Gestor do Contrato nº '+(r.contratoNum||'')]])}
function docProRelFisc(p){const r=p.prorrog,o=p.org;const fav=r.parecerFiscal!=='desfavoravel';const mesesTxt=`${nf(r.meses||12,0)} (${extInt(num(r.meses)||12)}) meses`;
 let h=`<div class="dh"><b>${esc((o.nome||'').toUpperCase())}${o.sigla?' – '+esc(o.sigla):''}</b></div><h1>Relatório de Fiscalização Contratual</h1><p class="sub">Manifestação quanto à continuidade da execução dos serviços</p>`+meta([['Processo SEI nº',fill(r.sei)],['Contrato nº',fill(r.contratoNum)],['Contratada',fill(r.contratada)],['Objeto',fill(r.objeto)],['Gestor do Contrato',fill(r.gestor)],['Fiscal do Contrato',fill(r.fiscal)+(r.fiscalMatricula?' · Matrícula nº '+esc(r.fiscalMatricula):'')]]);
 h+=`<h2>I · Da designação e da finalidade do relatório</h2>${r.portaria?`<p>Em atendimento às atribuições decorrentes da ${esc(r.portaria)}, o(a) servidor(a) ${esc(r.fiscal)}, ${esc(r.fiscalCargo||'')}${r.fiscalMatricula?', matrícula nº '+esc(r.fiscalMatricula):''}, foi designado(a) como responsável pela fiscalização dos contratos da ${esc(o.nome)}${r.portariaEfeitos?', com efeitos a partir de '+dtExt(r.portariaEfeitos):''}.</p>`:''}<p>O presente relatório tem por finalidade registrar os aspectos observados quanto à execução do Contrato nº ${esc(r.contratoNum)} e subsidiar a análise do Gestor do Contrato quanto à continuidade da prestação dos serviços pelo período adicional de ${mesesTxt}.</p>`;
 h+=`<h2>II · Da previsão contratual de prorrogação</h2><p>A possibilidade de prorrogação encontra-se expressamente prevista no contrato:</p><div class="box">“${fill(r.clausula)}”</div><p>Dessa forma, a continuidade da contratação deverá observar as condições estabelecidas no instrumento contratual, especialmente quanto à manutenção dos padrões de qualidade e dos preços contratados, além das providências necessárias à demonstração da vantajosidade para a Administração.</p>`;
 h+=`<h2>III · Da execução contratual</h2><p>Considerando o objeto contratado, verifica-se a relevância da continuidade dos serviços de ${esc(lc(r.objeto))}, tendo em vista sua utilização nas atividades desenvolvidas pela ${esc(o.nome)}.</p><p>Os serviços permanecem relacionados às necessidades operacionais da entidade, sendo a continuidade da contratação medida que contribui para assegurar a manutenção da estrutura necessária, evitando eventual descontinuidade.</p>`;
 h+=`<h2>IV · Das ocorrências e dos registros constantes dos autos</h2>`;
 if(r.trocaFiscal==='sim'&&r.portariaEfeitos)h+=`<p>Considerando que o signatário passou a exercer a função de Fiscal a partir de ${dt(r.portariaEfeitos)}, registra-se que o acompanhamento direto da execução referente ao período anterior não foi por ele realizado. Quanto a esse período, a manifestação baseia-se nos registros e documentos disponíveis nos autos do Processo SEI nº ${esc(r.sei)}.</p>`;
 h+=r.ocorrencias?paras(r.ocorrencias):`<p>A partir da análise dos registros constantes dos autos e do acompanhamento realizado, não foram identificados registros de ocorrências, inadimplementos ou fatos que indiquem comprometimento da execução contratual ou que desaconselhem a continuidade dos serviços.</p>`;
 h+=`<h2>V · Dos aspectos favoráveis à continuidade</h2><p>a) permanência da necessidade dos serviços contratados; b) adequação do objeto às necessidades operacionais da ${esc(o.sigla||'entidade')}; c) continuidade da disponibilidade dos equipamentos e serviços; d) manutenção dos padrões de qualidade compatíveis com o contrato e o Termo de Referência; e) ${r.ocorrencias?'ocorrências registradas devidamente tratadas':'inexistência de ocorrências que recomendem a interrupção'}; f) interesse da contratada na continuidade por ${mesesTxt}${r.aceiteMantem==='sim'?`; g) concordância da contratada com a manutenção do valor mensal de ${vext(r.valorMensal)}, sem pretensão de reajuste neste momento`:''}.</p>`;
 h+=`<h2>VI · Da manifestação do Fiscal</h2><p>${fav?`Diante dos registros e do acompanhamento realizado, manifesto-me ${r.parecerFiscal==='ressalvas'?'favoravelmente, com as ressalvas acima,':'favoravelmente'} à continuidade da execução do objeto pelo período adicional de ${mesesTxt}, considerando a permanência da necessidade administrativa, a adequação dos serviços e a manutenção dos padrões de qualidade.`:'Diante das ocorrências registradas, manifesto-me desfavoravelmente à continuidade da execução contratual.'}</p><p>Ressalta-se que esta manifestação se limita aos aspectos da fiscalização da execução contratual, não abrangendo a análise de vantajosidade econômica, disponibilidade orçamentária, regularidade fiscal e demais requisitos administrativos e jurídicos.</p>`;
 h+=`<h2>VII · Conclusão</h2><p>Encaminhe-se o presente relatório ao Gestor do Contrato, ${fill(r.gestor)}, para conhecimento e prosseguimento da instrução processual relativa à prorrogação contratual.</p>`;
 return h+local()+sigs([[r.fiscal,(r.fiscalCargo||'')+(r.fiscalMatricula?' · Matrícula nº '+r.fiscalMatricula:''),'Fiscal do Contrato nº '+(r.contratoNum||''),o.nome+(o.sigla?' – '+o.sigla:'')]])}
function docProDesp2(p){const r=p.prorrog,o=p.org,c=proCalc(p);let h=`<div class="dh"><b>${esc((o.nome||'').toUpperCase())}${o.sigla?' – '+esc(o.sigla):''}</b></div>`+despachoHead(p,{...proX(p),objeto:''}).replace(/<tr><td>Objeto<\/td>.*?<\/tr>/,'');
 h+=`<p>Considerando a manifestação formal apresentada pela empresa ${fill(r.contratada)}${r.aceiteDoc?' ('+esc(r.aceiteDoc)+')':''}, na qual declara seu interesse na prorrogação do presente Contrato pelo período de ${nf(r.meses||12,0)} (${extInt(num(r.meses)||12)}) meses${r.aceiteMantem==='sim'?', concordando com a manutenção das condições contratuais e, especialmente, com a manutenção do valor mensal de '+vext(r.valorMensal):''};</p>`;
 h+=`<p>Considerando o Relatório de Fiscalização Contratual apresentado pelo Fiscal, ${fill(r.fiscal)}, que se manifesta ${r.parecerFiscal==='desfavoravel'?'desfavoravelmente':'favoravelmente'} à continuidade da execução dos serviços;</p><p>Considerando que a cláusula de vigência do contrato prevê a possibilidade de prorrogação por períodos sucessivos, observado o limite legal, condicionando sua efetivação à demonstração de vantajosidade para a Administração e à continuidade dos padrões de qualidade e preços contratados;</p>`;
 h+=`<p>MANIFESTO-ME, no âmbito da gestão contratual, favoravelmente ao prosseguimento da instrução processual visando à prorrogação do presente Contrato pelo período de ${nf(r.meses||12,0)} (${extInt(num(r.meses)||12)}) meses, a partir de ${dtExt(c.novoIni)}, considerando a permanência da necessidade administrativa e as manifestações favoráveis constantes dos autos.</p><p>Para continuidade da instrução, encaminhem-se os autos para análise e demonstração da vantajosidade da prorrogação, considerando, entre outros elementos, a manutenção do valor mensal de ${brl(c.vmNovo)}, a qualidade e a continuidade da execução e as demais condições contratuais.</p><p>Após, sejam providenciadas as manifestações quanto à disponibilidade orçamentária, a verificação da regularidade da contratada (art. 91, §4º: regularidade fiscal, CEIS e CNEP) e demais documentos necessários, para posterior encaminhamento à análise jurídica e à formalização do Termo Aditivo.</p>`;
 return h+local()+sigs([[r.gestor,'Gestor do Contrato nº '+(r.contratoNum||''),o.nome+(o.sigla?' – '+o.sigla:'')]])}
function docProDesp3(p){const r=p.prorrog,o=p.org,dest=r.setorDestino||o.financeiro||'[setor]';let h=`<div class="dh"><b>${esc((o.nome||'').toUpperCase())}${o.sigla?' – '+esc(o.sigla):''}</b></div>`+despachoHead(p,proX(p));
 h+=`<p>Considerando a manifestação formal da empresa ${fill(r.contratada)} pela prorrogação do Contrato nº ${esc(r.contratoNum)} pelo período de ${nf(r.meses||12,0)} (${extInt(num(r.meses)||12)}) meses${r.aceiteMantem==='sim'?', com manutenção do valor mensal atualmente contratado de '+brl(r.valorMensal):''}, bem como a manutenção das demais condições contratuais;</p><p>Considerando o relatório apresentado pelo Fiscal do Contrato, ${fill(r.fiscal)}${r.portaria?', designado nos termos da '+esc(r.portaria.split(',').slice(0,2).join(',')):''};</p><p>Considerando, ainda, a necessidade de instrução dos autos quanto à vantajosidade da prorrogação contratual, nos termos do instrumento contratual e do artigo ${r.fundamento==='114'?'114':'107'} da Lei Federal nº 14.133/2021;</p>`;
 h+=`<p>ENCAMINHE-SE à ${fill(r.areaTecnica,'área técnica/demandante')}, para que proceda à pesquisa de mercado e apresente manifestação técnica quanto à vantajosidade da continuidade da contratação, mediante levantamento de preços junto a fornecedores do segmento e/ou outras fontes de pesquisa consideradas adequadas (art. 23 da Lei 14.133/2021 e IN UGAGP nº 05/2023).</p><p>A pesquisa deverá, sempre que possível, contemplar objetos e condições equivalentes às atualmente contratadas, de modo a permitir adequada comparação dos preços, considerando as especificações, os serviços especializados, o suporte técnico, as condições de execução e demais características relevantes do objeto.</p><p>Solicita-se que a área técnica registre, no resultado da pesquisa:</p><p>I · os fornecedores consultados;<br>II · as datas das consultas;<br>III · os valores apresentados;<br>IV · as condições comerciais consideradas;<br>V · as especificações do objeto pesquisado;<br>VI · eventual justificativa para impossibilidade de obtenção de determinada cotação; e<br>VII · manifestação conclusiva quanto à compatibilidade do valor atualmente contratado com os preços praticados no mercado.</p><p>Após a conclusão da pesquisa e juntada dos documentos comprobatórios aos autos, retornem os autos à ${esc(dest)}, para análise e consolidação dos elementos econômicos e administrativos relativos à vantajosidade da prorrogação contratual.</p>`;
 return h+local()+sigs([[r.gestor,'Gestor do Contrato']])}
function docProRelPesq(p){const r=p.prorrog,o=p.org,c=proCalc(p),dest=r.setorDestino||o.financeiro||'[setor]',destNome=o.financeiroNome&&dest===o.financeiro?o.financeiroNome+' – '+dest:dest;const ms=num(r.meses)||12;
 let h=`<div class="dh"><b>${esc((o.nome||'').toUpperCase())}${o.sigla?' – '+esc(o.sigla):''}</b></div><h1>Relatório de Pesquisa de Mercado e Manifestação Técnica</h1>`+meta([['Processo SEI nº',fill(r.sei)],['Contrato nº',fill(r.contratoNum)],['Contratada',fill(r.contratada)],['Objeto',fill(r.objeto)]]);
 h+=`<h2>1. Do objeto</h2><p>O presente relatório registra a pesquisa de mercado realizada pela área técnica/demandante, com a finalidade de subsidiar a análise da compatibilidade dos preços atualmente praticados no Contrato nº ${esc(r.contratoNum)}, celebrado entre a ${esc(o.nome)} e a empresa ${esc(r.contratada)}, no contexto da análise de eventual prorrogação pelo período de ${ms} (${extInt(ms)}) meses.</p>`;
 h+=`<h2>2. Da contratação vigente</h2><p>Valor mensal: ${brl(c.vm)}<br>Valor correspondente a ${ms} meses: ${brl(c.vm*ms)}</p>${r.aceiteMantem==='sim'?`<p>A contratada manifestou formalmente seu interesse na prorrogação, declarando concordância com a manutenção do valor mensal de ${brl(c.vm)} e das demais condições contratuais.</p>`:''}`;
 h+=`<h2>3. Da finalidade da pesquisa de mercado</h2><p>A pesquisa tem por finalidade obter elementos que permitam verificar a compatibilidade do preço atualmente contratado com os valores praticados no mercado, considerando as características e condições específicas do objeto. Foram consultados fornecedores do segmento, buscando-se propostas com características técnicas e condições de execução equivalentes ou compatíveis. A pesquisa não possui caráter de contratação e não representa compromisso com os fornecedores consultados.</p>`;
 h+=`<h2>4. Da metodologia adotada</h2><p>Foram encaminhadas solicitações de proposta comercial contendo a descrição do objeto e as especificações técnicas (Anexo I). As consultas e as respectivas respostas encontram-se anexadas aos autos. Na análise foram considerados, além do valor: I · características e especificações dos equipamentos; II · quantidade e composição; III · serviços especializados incluídos; IV · suporte técnico; V · manutenção e substituição; VI · demais condições de execução; VII · eventuais custos adicionais; VIII · prazos e condições de prestação.</p>`;
 const F_=r.fornecedores||[];
 h+=`<h2>5. Dos fornecedores consultados</h2><table><tr><th>Nº</th><th>Fornecedor</th><th>CNPJ</th><th>Data da consulta</th><th>Forma</th><th>Resposta</th></tr>${F_.map((f,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td>${fill(f.nome)}</td><td>${esc(f.cnpj)}</td><td>${dt(f.data)}</td><td>${esc(f.forma)}</td><td>${esc(f.resposta)}</td></tr>`).join('')}</table>`;
 h+=`<h2>6. Dos valores obtidos</h2><table><tr><th>Fornecedor</th><th class="num">Valor mensal</th><th class="num">Valor para ${ms} meses</th><th>Condições / observações</th></tr><tr><td>${esc(r.contratada)} · contrato vigente</td><td class="num">${brl(c.vm)}</td><td class="num">${brl(c.vm*ms)}</td><td>Valor atualmente contratado</td></tr>${F_.filter(f=>f.resposta==='Recebida').map(f=>`<tr><td>${esc(f.nome)}</td><td class="num">${brl(f.mensal)}</td><td class="num">${brl(num(f.mensal)*ms)}</td><td>${esc(f.obs)}</td></tr>`).join('')}</table>${c.vals.length?`<p>Média das propostas: ${brl(c.mea)} · Mediana: ${brl(c.med)} · Menor: ${brl(c.men)}. O valor contratado está ${c.med?nf(Math.abs((c.vm-c.med)/c.med*100),1)+'% '+(c.vm<=c.med?'abaixo':'acima')+' da mediana':''}.</p>`:''}<p>Os valores devem ser analisados considerando a equivalência entre os objetos, não sendo recomendável a comparação exclusivamente pelo preço quando houver diferenças relevantes.</p>`;
 h+=`<h2>7. Da análise técnica da comparabilidade</h2>${F_.filter(f=>f.resposta==='Recebida').map((f,i)=>`<h3>7.${i+1}. ${esc(f.nome)}</h3><p>Valor mensal: ${brl(f.mensal)}<br>Comparabilidade com o objeto contratado: ${fill(f.comp)}<br>Observações técnicas: ${fill(f.obsTec)}</p>`).join('')||'<p class="vazio">[nenhuma proposta recebida]</p>'}`;
 const OP={A:`O valor atualmente contratado, correspondente a ${brl(c.vm)} mensais, mostra-se compatível com os valores identificados na pesquisa de mercado, considerando as características técnicas e as condições de execução do objeto.`,B:`O valor atualmente contratado, correspondente a ${brl(c.vm)} mensais, mostra-se inferior aos valores identificados na pesquisa de mercado, considerando a equivalência das características técnicas e das condições de execução analisadas.`,C:`Embora tenham sido identificadas diferenças entre as condições apresentadas pelos fornecedores e aquelas atualmente contratadas, a análise técnica indica que os valores obtidos podem ser utilizados como referência, observadas as particularidades do objeto executado pela ${esc(o.sigla||'entidade')}.`,D:`Registra-se que parte dos fornecedores consultados não apresentou proposta no prazo solicitado. As consultas e as respostas recebidas encontram-se documentadas nos autos, tendo a área técnica utilizado, para fins de comparação, as informações efetivamente obtidas e consideradas tecnicamente pertinentes.`};
 const op=c.opcao;
 h+=`<h2>8. Da análise dos resultados</h2><p>${op?OP[op]:'<span class="vazio">[selecione o resultado]</span>'}</p>${op==='D'&&c.vals.length?`<p>${OP[c.vm<c.men?'B':'A']}</p>`:''}`;
 h+=`<h2>9. Da manifestação da área técnica</h2><p>Diante da pesquisa realizada e da análise das características técnicas do objeto, esta área técnica manifesta-se quanto à compatibilidade do valor atualmente contratado de ${brl(c.vm)} mensais com os preços identificados no mercado.</p>${r.conclusaoTec?paras(r.conclusaoTec):''}<p>A presente manifestação possui natureza técnica, destinando-se a subsidiar a análise administrativa e econômica quanto à eventual prorrogação.</p>`;
 const ck=k=>op===k||(op==='D'&&k===(c.vm<c.men?'B':'A')&&c.vals.length)?'[X]':'[ ]';
 h+=`<h2>10. Conclusão</h2><p>Com base nos elementos levantados, esta área técnica conclui que:</p><p>${ck('A')} o valor atualmente contratado mostra-se compatível com os preços praticados no mercado;<br>${ck('B')} o valor atualmente contratado mostra-se inferior aos valores identificados no mercado;<br>${op==='C'?'[X]':'[ ]'} não foi possível estabelecer comparação integral, em razão das particularidades técnicas do objeto, apresentando-se os elementos de mercado disponíveis;<br>[ ] outros: ____________________.</p><p>Encaminham-se os autos à ${esc(destNome)}, para conhecimento e prosseguimento da instrução, especialmente quanto à análise administrativa e econômica da vantajosidade da eventual prorrogação.</p>`;
 return h+local()+sigs([[r.tecnicoNome,r.tecnicoCargo||'[cargo/função]','Área Técnica/Demandante',o.nome+(o.sigla?' – '+o.sigla:'')]])}
function docProVant(p){const r=p.prorrog,o=p.org,c=proCalc(p),ms=num(r.meses)||12;
 let h=`<div class="dh"><b>${esc((o.nome||'').toUpperCase())}${o.sigla?' – '+esc(o.sigla):''}</b>${o.financeiroNome?'<br>'+esc(o.financeiroNome):''}</div><h1>Justificativa e Atestado de Vantajosidade da Prorrogação</h1><p class="sub">Lei 14.133/2021, arts. ${r.fundamento==='114'?'106 e 114':'106 e 107'} e art. 91, §4º</p>`+meta([['Processo SEI nº',fill(r.sei)],['Contrato nº',fill(r.contratoNum)],['Contratada',fill(r.contratada)+(r.cnpj?' · CNPJ '+esc(r.cnpj):'')],['Objeto',fill(r.objeto)],['Vigência atual',`${dt(r.inicioOriginal)} a ${dt(r.fimAtual)}`],['Prorrogação pretendida',`${dt(c.novoIni)} a ${dt(c.novoFim)} (${ms} meses)`]]);
 h+=`<h2>1. Fundamentação</h2><p>O contrato tem natureza de ${r.fundamento==='114'?'sistema estruturante de tecnologia da informação, admitida vigência máxima de 15 anos (art. 114)':'serviço de natureza contínua, admitida a prorrogação sucessiva até o limite de 10 anos, desde que haja previsão no edital/contrato e que a autoridade competente ateste que as condições e os preços permanecem vantajosos (art. 107)'}. A prorrogação está prevista na cláusula de vigência do instrumento. Com a prorrogação, a duração total será de cerca de ${c.mesesTot} meses, ${c.dentro?'dentro do':'<b>acima do</b>'} limite legal.</p>`;
 h+=`<h2>2. Necessidade de continuidade</h2><p>Permanece a necessidade administrativa do objeto, conforme manifestação do Gestor do Contrato, sendo a continuidade medida que evita a descontinuidade das atividades e os custos de uma nova contratação.</p>`;
 h+=`<h2>3. Desempenho da contratada</h2><p>O Fiscal do Contrato, ${esc(r.fiscal||'[fiscal]')}, manifestou-se ${r.parecerFiscal==='desfavoravel'?'desfavoravelmente':r.parecerFiscal==='ressalvas'?'favoravelmente, com ressalvas,':'favoravelmente'} à continuidade, atestando a manutenção dos padrões de qualidade${r.ocorrencias?'':' e a inexistência de ocorrências que desaconselhem a prorrogação'}.</p>`;
 h+=`<h2>4. Vantajosidade econômica</h2><p>${r.aceiteMantem==='sim'?`A contratada concordou em manter o valor mensal de ${vext(c.vm)}, sem reajuste.`:`A contratada solicitou reajuste de ${nf(r.aceiteReajuste||0)}%, resultando em valor mensal de ${brl(c.vmNovo)}, a ser verificado quanto ao interregno e ao índice contratual.`} A pesquisa de mercado registrou ${c.vals.length} proposta(s) válida(s), com mediana de ${brl(c.med)} e menor valor de ${brl(c.men)}. ${c.vals.length?(c.vmNovo<=c.med?`O valor a ser praticado é ${nf(Math.abs((c.vmNovo-c.med)/c.med*100),1)}% inferior à mediana de mercado, demonstrando a vantajosidade da manutenção do contrato.`:`O valor a ser praticado é ${nf((c.vmNovo-c.med)/c.med*100,1)}% superior à mediana de mercado; recomenda-se negociação com a contratada antes da prorrogação (art. 107, parte final).`):'<span class="vazio">[registrar o resultado da pesquisa]</span>'} Considera-se ainda a economia de custos administrativos de um novo procedimento e a ausência de período de transição.</p>`;
 h+=`<h2>5. Valor da prorrogação e dotação</h2><p>Valor mensal: ${brl(c.vmNovo)}. Valor para ${ms} meses: <b>${vext(c.anual)}</b>. A despesa correrá à conta da dotação ${fill(r.dotacao)}, cuja disponibilidade deverá ser atestada pelo setor competente.</p>`;
 h+=`<h2>6. Regularidade da contratada</h2><p>Antes da formalização, deverão ser juntadas a comprovação de regularidade fiscal, social e trabalhista e as consultas ao CEIS e ao CNEP, com as certidões negativas de inidoneidade, impedimento e suspensão (art. 91, §4º).</p>`;
 h+=`<h2>7. Atestado</h2><p>Diante do exposto, ATESTO que as condições e os preços do Contrato nº ${esc(r.contratoNum)} permanecem vantajosos para a Administração, e AUTORIZO o prosseguimento para análise jurídica (art. 53) e formalização do termo aditivo de prorrogação.</p>`;
 return h+local()+sigs([[r.gestor,'Gestor do Contrato'],[o.representante,o.cargoRep||'Autoridade competente']])}
function docProAditivo(p){const r=p.prorrog,o=p.org,c=proCalc(p),ms=num(r.meses)||12;const ON=esc((o.nome||'[CONTRATANTE]').toUpperCase());
 let h=`<div class="dh"><b>${ON}${o.sigla?' – '+esc(o.sigla):''}</b></div><h1>Termo Aditivo de Prorrogação ao Contrato nº ${fill(r.contratoNum)}</h1><p class="sub">Processo SEI nº ${fill(r.sei)}</p>`;
 h+=`<p>Pelo presente instrumento, de um lado a ${ON}, CNPJ nº ${fill(o.cnpj,'[CNPJ]')}, com sede em ${fill(o.endereco,'[endereço]')}, neste ato representada por ${fill(o.representante)}, ${esc(o.cargoRep||'')}, doravante CONTRATANTE, e de outro a empresa ${esc((r.contratada||'[CONTRATADA]').toUpperCase())}, CNPJ nº ${fill(r.cnpj,'[CNPJ]')}, neste ato representada por ${fill(r.representante,'[representante legal]')}, doravante CONTRATADA, resolvem celebrar o presente Termo Aditivo, com fundamento no art. ${r.fundamento==='114'?'114':'107'} da Lei Federal nº 14.133/2021 e na cláusula de vigência do contrato, mediante as cláusulas seguintes:</p>`;
 h+=`<p><b>CLÁUSULA PRIMEIRA · DO OBJETO.</b> Constitui objeto deste termo a prorrogação do prazo de vigência do Contrato nº ${esc(r.contratoNum)}, que tem por objeto ${esc(lc(r.objeto))}, por ${ms} (${extInt(ms)}) meses, de ${dt(c.novoIni)} a ${dt(c.novoFim)}.</p>`;
 h+=`<p><b>CLÁUSULA SEGUNDA · DO VALOR.</b> O valor mensal ${r.aceiteMantem==='sim'?'permanece':'passa a ser'} de ${vext(c.vmNovo)}, totalizando ${vext(c.anual)} para o período prorrogado.</p>`;
 h+=`<p><b>CLÁUSULA TERCEIRA · DA DOTAÇÃO.</b> As despesas correrão à conta da dotação orçamentária ${fill(r.dotacao)}.</p><p><b>CLÁUSULA QUARTA · DA RATIFICAÇÃO.</b> Ficam ratificadas as demais cláusulas e condições do contrato original não alteradas por este instrumento.</p><p>E, por estarem de acordo, as partes assinam o presente termo, juntamente com duas testemunhas.</p>`;
 return `<div class="tip">Minuta sujeita ao controle prévio de legalidade (art. 53). Assinar antes de ${dt(r.fimAtual)} e publicar no PNCP em até 10 dias úteis (art. 94, II).</div>`+h+local()+sigs([[o.representante,(o.cargoRep||'')+' · CONTRATANTE'],[r.representante,'CONTRATADA']])+sigs([['','Testemunha'],['','Testemunha']])}

async function enviarAuth(ev){
  ev.preventDefault();const b=$('#btnAuth');b.disabled=true;b.textContent='Aguarde…';
  const email=$('#auEmail').value.trim(),senha=$('#auSenha').value,nome=$('#auNome')?$('#auNome').value.trim():'';
  try{
    if(ui.gateTab==='cadastro'){
      const {data,error}=await sb.auth.signUp({email,password:senha,options:{data:{full_name:nome},emailRedirectTo:location.origin+location.pathname}});
      if(error)throw error;
      if(!data.session){ui.gateTab='login';pintarGate('login','Conta criada. Confirme o endereço pelo link enviado para '+email+' e depois entre.');return}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:senha});
      if(error)throw error;
    }
    await iniciar();
  }catch(err){b.disabled=false;b.textContent=ui.gateTab==='cadastro'?'Criar conta':'Entrar';pintarGate(ui.gateTab,'',msgErro(err))}

function msgErro(e){const m=String(e&&e.message||e);
  if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(/User already registered|already been registered/i.test(m))return 'Já existe uma conta com esse e-mail. Use a aba Entrar.';
  if(/Password should be/i.test(m))return 'A senha precisa de pelo menos 8 caracteres.';
  if(/rate limit|too many/i.test(m))return 'Muitas tentativas seguidas. Espere alguns minutos.';
  if(/Failed to fetch|NetworkError|load failed/i.test(m))return 'Sem conexão com o servidor.';
  return m}

async function iniciar(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    sessao=session;
    if(!sessao){pintarGate(ui.gateTab);return}
    const {data,error}=await sb.rpc('cpr_entrar');
    if(error)throw error;
    perfil=Array.isArray(data)?data[0]:data;
    if(!aprovado()){pintarGate('espera');return}
    await dbCarregar();
    montarApp();
  }catch(err){
    if(/JWT|session|token/i.test(String(err&&err.message))){await sb.auth.signOut();pintarGate('login','','Sua sessão expirou. Entre de novo.');return}
    pintarGate('offline',msgErro(err))}
}

async function dbCarregar(){
  const {data,error}=await sb.from('cpr_processos').select('id,nome,dados,atualizado_em,atualizado_por').order('atualizado_em',{ascending:false});
  if(error)throw error;
  S.procs=(data||[]).map(r=>({...(r.dados||{}),id:r.id,nome:r.nome,_at:r.atualizado_em,_by:r.atualizado_por}));
  if(S.procs.length&&!S.procs.find(x=>x.id===S.atual))S.atual=S.procs[0].id;
  if(!S.procs.length)S.atual=null;
}
const sujos=new Set();let saveT=null,salvando=false;
function save(){if(!S.atual)return;sujos.add(S.atual);marcarEstado('pendente');clearTimeout(saveT);saveT=setTimeout(descarregar,1200)}
async function descarregar(){
  if(salvando||!sujos.size)return;salvando=true;marcarEstado('salvando');
  const ids=[...sujos];sujos.clear();let falhou=null;
  for(const id of ids){
    const p=S.procs.find(x=>x.id===id);if(!p)continue;
    const {data,error}=await sb.from('cpr_processos').update(linha(p)).eq('id',id).select('atualizado_em').single();
    if(error){falhou=error;sujos.add(id)}else if(data){p._at=data.atualizado_em}
  }
  salvando=false;
  marcarEstado(falhou?'erro':'salvo',falhou?msgErro(falhou):'');
  if(sujos.size)setTimeout(descarregar,4000);
}
function marcarEstado(e,m){const el=$('#estado');if(!el)return;
  const t={pendente:['Alterações não salvas','w'],salvando:['Salvando…','n'],salvo:['Salvo '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),'o'],erro:['Falha ao salvar','c']}[e]||['','n'];
  el.className='pill '+t[1];el.textContent=t[0];el.title=m||''}
async function dbCriar(p){
  const {data,error}=await sb.from('cpr_processos').insert({...linha(p),criado_por:sessao.user.id}).select('id,atualizado_em').single();
  if(error)throw error;
  p.id=data.id;p._at=data.atualizado_em;S.procs.unshift(p);S.atual=p.id;return p}
async function dbExcluir(id){const {error}=await sb.from('cpr_processos').delete().eq('id',id);if(error)throw error;
  S.procs=S.procs.filter(x=>x.id!==id);S.atual=S.procs.length?S.procs[0].id:null}

/* ---- usuários ---- */
let usuarios=[];
async function carregarUsuarios(){const {data,error}=await sb.from('cpr_perfis').select('*').order('criado_em',{ascending:false});if(error)throw error;usuarios=data||[];return usuarios}
async function mudarUsuario(id,campos){const {error}=await sb.from('cpr_perfis').update(campos).eq('id',id);if(error)throw error;await carregarUsuarios()}

function edAdmin(){
  const pend=usuarios.filter(u=>u.status==='pendente'),out=usuarios.filter(u=>u.status!=='pendente');
  const chip=u=>`<span class="pill ${u.status==='aprovado'?'o':u.status==='bloqueado'?'c':'w'}">${u.status==='aprovado'?'Liberado':u.status==='bloqueado'?'Bloqueado':'Aguardando'}</span>${u.papel==='admin'?'<span class="pill n">Administrador</span>':''}`;
  const linhaU=u=>`<tr><td><b>${esc(u.nome||'Sem nome')}</b><br><span class="muted" style="font-size:12px">${esc(u.email)}</span></td><td>${chip(u)}</td><td class="muted" style="font-size:12px">${dt((u.criado_em||'').slice(0,10))}</td><td class="row" style="gap:4px;justify-content:flex-end">
    ${u.status!=='aprovado'?`<button class="btn sm pri" data-act="uAprovar" data-id="${u.id}">Liberar</button>`:''}
    ${u.status==='aprovado'?`<button class="btn sm" data-act="uBloquear" data-id="${u.id}">Bloquear</button>`:''}
    ${u.papel!=='admin'&&u.status==='aprovado'?`<button class="btn sm" data-act="uPromover" data-id="${u.id}">Tornar admin</button>`:''}
    ${u.papel==='admin'&&u.id!==sessao.user.id?`<button class="btn sm" data-act="uRebaixar" data-id="${u.id}">Remover admin</button>`:''}
    ${u.id!==sessao.user.id?`<button class="btn sm ghost danger" data-act="uExcluir" data-id="${u.id}">Excluir</button>`:''}</td></tr>`;
  const url=location.origin+location.pathname;
  return `${pend.length?`<div class="alert w"><b>${pend.length} ${pend.length===1?'pessoa aguarda':'pessoas aguardam'} liberação.</b> Ninguém entra na plataforma antes de você liberar.</div>`:'<div class="alert o">Nenhum pedido de acesso pendente.</div>'}
  <fieldset><legend>Pedidos de acesso${pend.length?' ('+pend.length+')':''}</legend>${pend.length?`<div class="tblwrap"><table class="tbl"><tr><th>Pessoa</th><th>Situação</th><th>Cadastro</th><th></th></tr>${pend.map(linhaU).join('')}</table></div>`:'<p class="muted">Nada pendente no momento.</p>'}</fieldset>
  <fieldset><legend>Pessoas com conta (${out.length})</legend><div class="tblwrap"><table class="tbl"><tr><th>Pessoa</th><th>Situação</th><th>Cadastro</th><th></th></tr>${out.map(linhaU).join('')}</table></div><div class="row" style="margin-top:8px"><button class="btn sm" data-act="recarregarUsuarios">Atualizar lista</button></div></fieldset>
  <fieldset><legend>Configuração do acesso<span class="lr">feita no painel do Supabase</span></legend><p class="muted" style="font-size:13px;margin:0 0 8px">Para o botão do Google funcionar e para a confirmação de e-mail chegar no endereço certo, estes passos precisam ser feitos uma vez no painel do Supabase, no projeto <b>Batida Ponto</b>:</p><ol style="font-size:13px;line-height:1.6;margin:0;padding-left:20px"><li>Authentication → URL Configuration: coloque <code>${esc(url)}</code> em Site URL e em Redirect URLs.</li><li>Authentication → Sign In / Providers → Google: ative e cole o Client ID e o Client Secret criados no Google Cloud Console.</li><li>No Google Cloud Console, autorize o redirecionamento <code>${esc(SUPA_URL)}/auth/v1/callback</code>.</li></ol></fieldset>`}

/* ---- montagem ---- */
function montarApp(){
  document.body.innerHTML=APP_HTML;
  const el=$('#procSelect');if(el)el.addEventListener('change',trocarProc);
  $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')});
  renderTop();route();
}
function trocarProc(e){S.atual=e.target.value;renderTop();renderSide();renderMain()}

window.addEventListener('hashchange',route);
pintarGate('carregando');
try{if(!window.supabase)throw new Error('A biblioteca de acesso não carregou. Baixe a página de novo e publique o arquivo inteiro.');
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){perfil=null;sessao=null;pintarGate('login')}});
  iniciar();
}catch(err){pintarGate('offline',msgErro(err))}
window.addEventListener('beforeunload',e=>{if(sujos.size){e.preventDefault();e.returnValue=''}});
</script>
